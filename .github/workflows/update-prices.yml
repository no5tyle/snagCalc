name: Update prices

on:
  schedule:
    - cron: '17 19 * * 0' # Mondays ~6am AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs
      - run: npm test
      - name: Commit updated prices
        run: |
          if git diff --quiet data/catalogue.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json
          git commit -m "Update supermarket prices"
          git push

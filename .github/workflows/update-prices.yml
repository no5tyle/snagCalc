name: Update Drakes prices

# Refreshes data/drakes.json from the Drakes online store every week.
# Woolworths blocks GitHub's servers, so data/woolworths.json is updated from
# the website instead (Recipe & prices -> Update Woolworths prices) and uploaded.

on:
  schedule:
    - cron: '17 19 * * 0' # Mondays ~6am AEDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-prices.mjs --store drakes
      - run: npm test
      - name: Commit updated prices
        run: |
          if git diff --quiet data/drakes.json; then
            echo "No price changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/drakes.json
          git commit -m "Update Drakes prices"
          git pull --rebase
          git push

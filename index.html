<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Snag Calc</title>
  <meta name="description" content="Fundraising BBQ shopping list and restock calculator">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌭</text></svg>">
  <link rel="stylesheet" href="https://no5tyle.github.io/shared/no5tyle.css">
  <script src="https://no5tyle.github.io/shared/app-switcher.js" defer></script>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <!-- The bar across the top, as in no5tyle's other apps: the app switcher and the app's name -->
  <header class="appbar">
    <!-- The switcher between no5tyle's apps (no5tyle.github.io/shared/app-switcher.js) -->
    <n5-app-switcher current="snagcalc">
      <img src="https://no5tyle.github.io/shared/icons/snagcalc.svg" alt="" width="36" height="36">
    </n5-app-switcher>
    <div class="appbar-brand">
      <h1 class="brand-title">Snag Calc</h1>
      <p class="brand-sub tagline"><span id="group-name">Scout Group</span> fundraising BBQ planner</p>
    </div>
  </header>

  <div class="frame">
    <!-- On a computer, a sidebar with what's being planned and the shared options. On a phone the item
         tabs float at the bottom of the screen and the options sit above the planner -->
    <aside class="sidebar">
      <nav id="menu-tabs" class="menu-tabs glass" role="tablist" aria-label="What you're planning"></nav>
      <section class="toolbar card" aria-label="Shared options">
        <label>Shop at
          <select id="store"></select>
        </label>
        <label id="buffer-label">Wastage buffer (food)
          <span class="input-suffix"><input id="buffer" type="number" min="0" max="100" step="1" inputmode="numeric"><span>%</span></span>
        </label>
      </section>
    </aside>

  <main class="wrap">

    <nav class="tabs" role="tablist" aria-label="View">
      <button role="tab" id="tab-plan" aria-controls="panel-plan" aria-selected="true">Plan</button>
      <button role="tab" id="tab-restock" aria-controls="panel-restock" aria-selected="false">Restock</button>
      <button role="tab" id="tab-settings" aria-controls="panel-settings" aria-selected="false">Recipe &amp; prices</button>
    </nav>

    <section id="panel-plan" role="tabpanel" aria-labelledby="tab-plan">
      <div class="card" id="plan-inputs"></div>
      <div id="plan-results"></div>
    </section>

    <section id="panel-restock" role="tabpanel" aria-labelledby="tab-restock" hidden>
      <div class="card" id="restock-inputs"></div>
      <div id="restock-results"></div>
    </section>

    <section id="panel-settings" role="tabpanel" aria-labelledby="tab-settings" hidden>
      <div class="card">
        <h2 id="recipe-title">Recipe</h2>
        <p class="hint" id="recipe-hint"></p>
        <div class="table-scroll"><table id="recipe-table" class="data stack"></table></div>
        <div id="custom-items"></div>
      </div>
      <div class="card">
        <h2>Prices</h2>
        <p class="hint" id="price-info"></p>
        <p><button class="primary" data-open-wizard>Check prices step by step</button></p>
        <div class="table-scroll"><table id="price-table" class="data stack"></table></div>
      </div>
      <div class="card">
        <button id="reset" class="secondary">Reset all settings</button>
      </div>
    </section>
  </main>
  </div>

  <footer class="wrap site-footer">
    <p>Prices change over time and between stores, so check them before you shop. Your settings are saved in this browser only.
      <button class="link" data-open-wizard>Check prices step by step</button></p>
  </footer>

  <dialog id="wizard" class="wizard" aria-labelledby="wizard-title"></dialog>

  <!-- "Are you sure?" in Snag Calc's own style (confirmAction in app.js), not the browser's confirm box -->
  <dialog id="confirm" class="confirm-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-text">
    <form method="dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="confirm-actions">
        <button class="secondary" value="cancel">Cancel</button>
        <button class="primary" id="confirm-ok" value="ok"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
